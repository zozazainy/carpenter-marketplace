
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="../css/project-form.css">
    <title>Customer Project Form</title>
</head>
<body>

    <h1>Submit Your Furniture Project</h1>

    <form id="projectForm">

        <!-- Furniture Category -->
        <label for="category">Furniture Category:</label>
        <select id="category" required>
            <option value="">Select Category</option>
            <option value="wardrobe">Wardrobe</option>
            <option value="bed">Bed</option>
            <option value="table">Study Table</option>
            <option value="cabinet">Kitchen Cabinet</option>
        </select>

        <br><br>

        <!-- Dimensions -->
        <label for="length">Length:</label>
        <input type="number" id="length" min="1" required>

        <br><br>

        <label for="height">Height:</label>
        <input type="number" id="height" min="1" required>

        <br><br>

        <label for="depth">Depth:</label>
        <input type="number" id="depth" min="1" required>

        <br><br>

        <!-- Material -->
        <label for="material">Material:</label>
        <select id="material" required>
            <option value="">Select Material</option>
            <option value="wood">Solid Wood</option>
            <option value="mdf">MDF</option>
            <option value="plywood">Plywood</option>
            <option value="melamine">Melamine</option>
        </select>

        <br><br>

        <!-- Finishing -->
        <label for="finishing">Finishing:</label>
        <select id="finishing" required>
            <option value="">Select Finishing</option>
            <option value="matte">Matte</option>
            <option value="glossy">Glossy</option>
            <option value="polish">Polish</option>
            <option value="paint">Paint</option>
        </select>

        <br><br>

        <!-- Additional Requirements -->
        <label for="requirements">
            Additional Requirements:
        </label>
        <textarea id="requirements"></textarea>

        <br><br>

        <!-- Image Upload -->
        <label for="image">Upload Reference Image:</label>
        <input type="file" id="image" accept="image/*">

        <br><br>

        <button type="submit">Submit Project</button>

    </form>

    <script src="script.js"></script>

</body>
</html>
