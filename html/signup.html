
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | CRAFTORA</title>

    <link rel="stylesheet" href="../css/signup.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <a href="../index.html" class="logo">CRAFT<span>ORA</span></a>

        <p>Your Style, Our Commitment</p>

        <a href="../index.html" class="home-link">Back to Home</a>
    </header>

    <!-- SIGNUP CONTAINER -->
    <main class="signup-container">

        <div class="signup-box">

            <h1>Create Your Account</h1>
            <p class="subtitle">Join CRAFTORA and get started today.</p>

            <!-- USER ROLE -->
            <div class="role-selection">
                <button type="button" class="role-btn active" data-role="Customer">
                    Customer
                </button>

                <button type="button" class="role-btn" data-role="Carpenter">
                    Carpenter
                </button>
            </div>

            <!-- SIGNUP FORM -->
            <form id="signupForm">

                <input type="hidden" id="userRole" name="userRole" value="Customer">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-box">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="8"
                            required
                        >

                        <button type="button" id="togglePassword">
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="8"
                        required
                    >
                </div>

                <div class="terms">
                    <input type="checkbox" id="terms" required>

                    <label for="terms">
                        I agree to the Terms and Conditions.
                    </label>
                </div>

                <button type="submit" class="signup-btn">
                    Create Account
                </button>

                <p id="message"></p>

            </form>

            <div class="login-link">
                Already have an account?
                <a href="login.html">Login</a>
            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>&copy; 2026 CRAFTORA. All Rights Reserved.</p>
    </footer>

    <script src="../javascript/signup.js"></script>

</body>
</html>
