
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRAFTORA | Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <a href="../index.html" class="logo">
            CRAFT<span>ORA</span>
            <small>Your Style, Our Commitment</small>
        </a>

        <a href="../index.html" class="home-link">Back to Home</a>

    </header>


    <!-- LOGIN SECTION -->
    <main class="login-container">

        <div class="login-box">

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Login to your CRAFTORA account.
            </p>


            <!-- USER TYPE -->
            <div class="user-type">

                <button type="button" class="role-btn active" data-role="customer">
                    Customer
                </button>

                <button type="button" class="role-btn" data-role="carpenter">
                    Carpenter
                </button>

            </div>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <input type="hidden" id="userRole" value="customer">

                <div class="form-group">

                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button type="button" id="togglePassword">
                            Show
                        </button>

                    </div>

                </div>


                <div class="form-options">

                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>

                    <a href="#" id="forgotPassword">Forgot Password?</a>

                </div>


                <button type="submit" class="login-btn">
                    Login
                </button>


                <p id="message" class="message"></p>

            </form>


            <!-- SIGN UP LINK -->
            <div class="signup-link">

                <p>
                    Don't have an account?
                    <a href="signup.html">Create Account</a>
                </p>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        <h2>CRAFTORA</h2>

        <p>Your Style, Our Commitment</p>

        <p>&copy; 2026 CRAFTORA. All Rights Reserved.</p>

    </footer>


    <!-- JAVASCRIPT -->
    <script src="../javascript/login.js" defer></script>

</body>
</html>
